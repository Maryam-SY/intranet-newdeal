name: CI Pipeline - Dev

on:
  push:
    branches: [dev]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:alpine3.23-slim
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: " CRITICAL vulnerability detected - intranet-newdeal"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Une vulnérabilité CRITICAL a été détectée dans l'image nginx:alpine3.23-slim.
            Pipeline bloqué automatiquement.
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev

      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: " Pipeline CI réussi - intranet-newdeal"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Le pipeline CI s'est exécuté avec succès !
            Image pushée : ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev
            Branch: ${{ github.ref_name }}
