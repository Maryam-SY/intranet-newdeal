name: CD Pipeline - Prod

on:
  push:
    branches: [prod]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:alpine3.23
          format: table
          exit-code: 0

  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, runner_prod]
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        shell: powershell
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev

      - name: Run container on port 80
        shell: powershell
        run: |
          docker run -d --name intranet -p 80:80 `
          ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:dev

